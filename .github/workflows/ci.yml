name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same PR or branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Restrict permissions to minimum needed
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title is conventional
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits: <type>[optional scope]: <description>"
            echo "  Got: $PR_TITLE"
            echo "  Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi

  # Lint via pre-commit so CI enforces exactly the hook set contributors run
  # locally (shellcheck, actionlint, zsh/bash syntax, forbidden-trigger ban).
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install lint dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run pre-commit hooks
        run: pipx run pre-commit run --all-files --show-diff-on-failure

  lint-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pre-commit
        run: brew install pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  test-linux:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run E2E tests
        run: bash test_e2e.sh

  test-linux-podman:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Run E2E tests against podman
        run: SAGENT_CONTAINER_ENGINE=podman bash test_e2e.sh

  test-devcontainers:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli
      - name: Run devcontainer build tests
        run: bash test_devcontainers.sh
      # The dev container runs as UID-1000 vscode with a nested Docker daemon —
      # the configuration that exposed bugs #56 (ubuntu-user sudoers collision)
      # and #57 (SELinux) classes of platform bugs. Run the full suite inside.
      - name: Run E2E suite inside the dev container (UID 1000, Docker-in-Docker)
        run: |
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . bash test_e2e.sh
