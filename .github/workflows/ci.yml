name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same PR or branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Restrict permissions to minimum needed
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title is conventional
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits: <type>[optional scope]: <description>"
            echo "  Got: $PR_TITLE"
            echo "  Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi

  # Lint via pre-commit so CI enforces exactly the hook set contributors run
  # locally (shellcheck, actionlint, zsh/bash syntax, forbidden-trigger ban).
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install lint dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run pre-commit hooks
        run: pipx run pre-commit run --all-files --show-diff-on-failure

  lint-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pre-commit
        run: brew install pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  test-linux:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run E2E tests
        run: bash test_e2e.sh

  test-linux-podman:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Run E2E tests against podman
        run: SAGENT_CONTAINER_ENGINE=podman bash test_e2e.sh

  # Real docker CLI talking to a podman server through the docker-compat
  # socket — the flavor combo where builds must use the classic builder
  # endpoint (DOCKER_BUILDKIT=0) instead of buildx.
  test-linux-docker-cli-podman:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman and expose its docker-compat socket
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          podman system service --time=0 "unix:///tmp/podman-compat.sock" &
          for _ in $(seq 1 20); do
            [ -S /tmp/podman-compat.sock ] && break
            sleep 0.5
          done
          echo "DOCKER_HOST=unix:///tmp/podman-compat.sock" >> "$GITHUB_ENV"
      - name: Verify flavor detection
        run: docker version | grep -qi podman
      - name: Run E2E tests (docker CLI on podman server)
        run: SAGENT_CONTAINER_ENGINE=docker bash test_e2e.sh

  # A `docker` command that is actually podman (the podman-docker shim
  # arrangement), exercised via a podman symlink named docker on PATH.
  test-linux-podman-shim:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman and front it as the docker command
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          mkdir -p "$HOME/shimbin"
          ln -s "$(command -v podman)" "$HOME/shimbin/docker"
          echo "$HOME/shimbin" >> "$GITHUB_PATH"
      - name: Run E2E tests (podman as the docker command)
        run: SAGENT_CONTAINER_ENGINE=docker bash test_e2e.sh

  test-macos:
    # Real macOS host with a Linux VM behind the engine — the Docker Desktop /
    # podman machine topology (docker CLI on the host, dockerd in a VM). Runs
    # on the Intel runner: Apple Silicon runners have no nested virtualization,
    # so the VM cannot start there. T27 inside adds the third nesting level
    # (mac host -> VM -> sandbox container -> nested podman container).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Install docker CLI, buildx, and colima
        run: |
          brew install docker docker-buildx colima
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix)/opt/docker-buildx/bin/docker-buildx" ~/.docker/cli-plugins/docker-buildx
      - name: Start colima VM
        # vz (Virtualization.framework) instead of the default qemu — markedly
        # faster on the Intel runners.
        run: colima start --vm-type vz --cpu 4 --memory 10 --disk 30
      - name: Run E2E tests
        # This job's unique coverage is the mac-host/VM topology; T10's update
        # logic is engine-independent and covered by every Linux job, and its
        # forced no-cache rebuild takes 30+ minutes on this runner. The cold
        # T02 build needs more than the default 600s per-test budget.
        env:
          TEST_TIMEOUT_SECONDS: "1200"
          SAGENT_TEST_SKIP: "T10"
        run: bash test_e2e.sh

  test-devcontainers:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli
      - name: Run devcontainer build tests
        run: bash test_devcontainers.sh
      # The dev container runs as UID-1000 vscode with a nested Docker daemon —
      # the configuration that exposed bugs #56 (ubuntu-user sudoers collision)
      # and #57 (SELinux) classes of platform bugs. Run the full suite inside.
      - name: Run E2E suite inside the dev container (UID 1000, Docker-in-Docker)
        run: |
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . bash test_e2e.sh
