name: CI

on:
  pull_request:
  push:
    branches: [main]

# No test jobs on the release PR; only `what-ran` runs there. The commit is
# tested on main after the merge.

# Cancel superseded PR runs, never main's: a release could be cut from a
# commit whose tests were cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Restrict permissions to minimum needed
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The runners are Azure VMs; the default archive has taken ten minutes for
  # one index here. The macOS jobs keep it: it is part of the image hash.
  SAGENT_APT_MIRROR: http://azure.archive.ubuntu.com/ubuntu/
  # A cold image build does not fit the harness's default 600s.
  TEST_TIMEOUT_SECONDS: "1200"
  # A build failure's own error sits above the Dockerfile excerpt the engine
  # prints, beyond the default 30 lines (#110).
  FAIL_OUTPUT_LINES: "120"

jobs:
  # A run with every job filtered out is a failure to GitHub (#89). This job
  # always runs and says why the others did not.
  what-ran:
    runs-on: ubuntu-latest
    steps:
      - name: Say which jobs this run has and why
        # A branch name is whatever its author typed, so it reaches the shell
        # as data in the environment, never spliced into the script.
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$HEAD_REF" = 'release-please--branches--main' ]; then
            echo "Release PR: the test jobs are skipped on purpose."
            echo "The commit is tested on main right after the merge, and the"
            echo "release workflow re-verifies the published wrappers."
          else
            echo "Testing $EVENT on $REF_NAME."
          fi

  commit-lint:
    if: github.event_name == 'pull_request' && github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title is conventional
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits: <type>[optional scope]: <description>"
            echo "  Got: $PR_TITLE"
            echo "  Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi

  # Lint via pre-commit so CI enforces exactly the hook set contributors run
  # locally (shellcheck, actionlint, zsh/bash syntax, forbidden-trigger ban).
  lint:
    if: github.event_name == 'pull_request' && github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install lint dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run pre-commit hooks
        run: pipx run pre-commit run --all-files --show-diff-on-failure

  lint-macos:
    if: github.event_name == 'pull_request' && github.head_ref != 'release-please--branches--main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # The actionlint hook is built with Go. The macOS image ships none, and
      # pre-commit then fetches the newest release listed on go.dev, which
      # can be listed before its darwin-arm64 archive exists (#108). A Go
      # from the toolcache makes pre-commit use that instead.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install pre-commit
        run: brew install pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  test-linux:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run E2E tests
        run: bash test_e2e.sh

  test-linux-podman:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Run E2E tests against podman
        run: SAGENT_CONTAINER_ENGINE=podman bash test_e2e.sh

  # Real docker CLI on a podman server: builds must use the classic builder.
  # Rootful socket; a rootless one is refused (#75, T34).
  test-linux-docker-cli-podman:
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman and expose its docker-compat socket
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          sudo podman system service --time=0 "unix:///tmp/podman-compat.sock" &
          for _ in $(seq 1 20); do
            [ -S /tmp/podman-compat.sock ] && break
            sleep 0.5
          done
          sudo chmod 666 /tmp/podman-compat.sock
          echo "DOCKER_HOST=unix:///tmp/podman-compat.sock" >> "$GITHUB_ENV"
      - name: Verify flavor detection (podman server, rootful)
        run: |
          docker version | grep -qi podman
          docker info --format '{{join .SecurityOptions ","}}' | grep -qv rootless
      - name: Run E2E tests (docker CLI on podman server)
        run: SAGENT_CONTAINER_ENGINE=docker bash test_e2e.sh

  # A `docker` command that is actually podman (the podman-docker shim
  # arrangement), exercised via a podman symlink named docker on PATH.
  test-linux-podman-shim:
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman and front it as the docker command
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          mkdir -p "$HOME/shimbin"
          ln -s "$(command -v podman)" "$HOME/shimbin/docker"
          echo "$HOME/shimbin" >> "$GITHUB_PATH"
      - name: Run E2E tests (podman as the docker command)
        run: SAGENT_CONTAINER_ENGINE=docker bash test_e2e.sh

  # The trimmed image the macOS jobs test with, built once here and loaded
  # there. Building on those VMs took 20-57 minutes depending on the runner
  # and timed a slice out (#98). Built for the runner's uid/gid (501/20) so
  # the tag is the one the wrapper computes there.
  build-macos-image:
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the trimmed image for the macOS runners
        run: |
          mkdir -p ~/.config/sagent
          printf '%s\n' 'SAGENT_TOOLS="none"' 'SAGENT_RUST_VERSION="none"' \
            'SAGENT_GO_VERSION="none"' 'SAGENT_JAVA_VERSION="none"' > ~/.config/sagent/config
          ctx=$(mktemp -d)
          SAGENT_IMAGE_UID=501 SAGENT_IMAGE_GID=20 SAGENT_SKIP_RELEASE_CHECK=1 \
            ./sclaude dockerfile > "$ctx/Dockerfile"
          tag=$(sed -n 's/.*sagent\.version="\([0-9a-f]*\)".*/\1/p' "$ctx/Dockerfile")
          [ -n "$tag" ]
          docker build --load --build-arg USER_UID=501 --build-arg USER_GID=20 \
            -t "sagent-sandbox:$tag" -f "$ctx/Dockerfile" "$ctx"
          docker save "sagent-sandbox:$tag" | zstd -T0 -3 -o sagent-macos-image.tar.zst
          ls -l sagent-macos-image.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: sagent-macos-image
          path: sagent-macos-image.tar.zst
          compression-level: 0
          retention-days: 1

  test-macos:
    # macOS host, dockerd in a colima VM. Intel runner: Apple Silicon runners
    # have no nested virtualization.
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    needs: build-macos-image
    runs-on: macos-15-intel
    # Two slices: the whole suite took 95-100 minutes here (#96). Not more:
    # five macOS runners is the hosted concurrency limit.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    name: test-macos (${{ matrix.shard }})
    env:
      # The mirror is part of the image hash, so it must match the builder.
      SAGENT_TEST_SHARD: ${{ matrix.shard }}
    # A slice takes about 50 minutes (5 VM + 15 load + 30 tests), on a VM
    # whose speed varies twofold.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - name: Install docker CLI, buildx, and colima
        run: |
          brew install docker docker-buildx colima
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix)/opt/docker-buildx/bin/docker-buildx" ~/.docker/cli-plugins/docker-buildx
      - name: Start colima VM
        # vz is markedly faster than qemu here. --dns: the VM's own resolver
        # failed 597 times in one build (#93).
        run: colima start --vm-type vz --cpu 4 --memory 10 --disk 30 --dns 1.1.1.1 --dns 8.8.8.8
      - name: Wait for the VM's docker daemon
        # colima start can return before dockerd is reachable.
        run: |
          for _ in $(seq 1 24); do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "colima reports started but docker is not reachable" >&2
          colima status
          exit 1
      - name: Report the engine's image store
        # The containerd image store, as on Rancher Desktop: a load unpacks.
        run: docker info --format 'driver={{.Driver}} status={{json .DriverStatus}}'
      - name: Trim the sandbox image for this VM job
        # The same settings the builder used, so the wrapper computes the same
        # hash. The config file, not the environment, so tests that set their
        # own (T32, T35, T38) see the defaults.
        run: |
          mkdir -p ~/.config/sagent
          printf '%s\n' 'SAGENT_TOOLS="none"' 'SAGENT_RUST_VERSION="none"' \
            'SAGENT_GO_VERSION="none"' 'SAGENT_JAVA_VERSION="none"' > ~/.config/sagent/config
      - uses: actions/download-artifact@v4
        with:
          name: sagent-macos-image
      - name: Load the prebuilt image
        # The tag must be the one the wrapper here would build; otherwise the
        # suite would silently build its own, which is what this replaces.
        run: |
          brew install zstd
          zstd -dc sagent-macos-image.tar.zst | docker load
          rm sagent-macos-image.tar.zst
          # The daemon keeps unpacking after `load` returns and can leave
          # `docker info` unanswered for a while (#109).
          for _ in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info >/dev/null 2>&1 || { echo "::error::the engine did not answer within 120s of the image load"; exit 1; }
          want=$(SAGENT_SKIP_RELEASE_CHECK=1 SAGENT_ENGINE_TIMEOUT_SECONDS=60 ./sclaude version | sed -n 's/^Image hash: //p')
          if ! docker image inspect "sagent-sandbox:$want" >/dev/null 2>&1; then
            echo "::error::the prebuilt image is not the one this runner computes ($want); loaded: $(docker images sagent-sandbox --format '{{.Tag}}' | tr '\n' ' ')"
            exit 1
          fi
      - name: Run E2E tests
        # Skipped: T02 (built above), T10, T10b and T31 (full builds the
        # Linux jobs cover), T12b (colima shares only $HOME and /tmp/colima,
        # which is also why fixtures live under the home directory).
        env:
          SAGENT_TEST_SKIP: "T02 T10 T10b T31 T12b"
          # docker info has stalled past 10s under build load here.
          SAGENT_ENGINE_TIMEOUT_SECONDS: "60"
        run: |
          mkdir -p "$HOME/sagent-test"
          SAGENT_TEST_TMPDIR="$HOME/sagent-test" bash test_e2e.sh

  # Rancher Desktop's docker CLI to dockerd in its Lima VM, driven with
  # rdctl (the setup behind #68).
  test-macos-rancher:
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    needs: build-macos-image
    runs-on: macos-15-intel
    # Split in two for the same reason as test-macos.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    name: test-macos-rancher (${{ matrix.shard }})
    # A slice takes about 50 minutes (5 VM + 15 load + 30 tests), on a VM
    # whose speed varies twofold; a VM restart below adds up to 7.
    timeout-minutes: 100
    env:
      SAGENT_TEST_SHARD: ${{ matrix.shard }}
      RDCTL: /Applications/Rancher Desktop.app/Contents/Resources/resources/darwin/bin/rdctl
    steps:
      - uses: actions/checkout@v5
      - name: Install Rancher Desktop
        # A quarantined app blocks on a Gatekeeper prompt nobody can click.
        run: |
          brew install --cask rancher
          xattr -l "/Applications/Rancher Desktop.app" || true
          xattr -dr com.apple.quarantine "/Applications/Rancher Desktop.app" || true
          xattr -l "/Applications/Rancher Desktop.app" || true
      - name: Start Rancher Desktop (dockerd engine, no Kubernetes, in the background)
        run: |
          "$RDCTL" start \
            --application.start-in-background \
            --application.admin-access=false \
            --application.updater.enabled=false \
            --application.path-management-strategy=manual \
            --container-engine.name=moby \
            --kubernetes.enabled=false \
            --virtual-machine.type=vz \
            --virtual-machine.memory-in-gb=10 \
            --virtual-machine.number-cpus=4 \
            --no-modal-dialogs
          echo "$HOME/.rd/bin" >> "$GITHUB_PATH"
      - name: Wait for Rancher Desktop's docker daemon
        # The VZ guest occasionally boots without network; one restart, then
        # diagnostics.
        run: |
          wait_ready() {
            for _ in $(seq 1 "$1"); do
              if [ -x "$HOME/.rd/bin/docker" ] && "$HOME/.rd/bin/docker" info >/dev/null 2>&1; then
                return 0
              fi
              sleep 10
            done
            return 1
          }
          if wait_ready 42; then exit 0; fi
          echo "Rancher Desktop not ready after 7 minutes; restarting it once" >&2
          "$RDCTL" shutdown || true
          sleep 15
          "$RDCTL" start \
            --application.start-in-background \
            --application.admin-access=false \
            --application.updater.enabled=false \
            --application.path-management-strategy=manual \
            --container-engine.name=moby \
            --kubernetes.enabled=false \
            --virtual-machine.type=vz \
            --virtual-machine.memory-in-gb=10 \
            --virtual-machine.number-cpus=4 \
            --no-modal-dialogs
          if wait_ready 60; then exit 0; fi
          echo "Rancher Desktop did not become ready" >&2
          pgrep -fl "Rancher Desktop" || echo "no Rancher Desktop process"
          "$RDCTL" list-settings || true
          ls -la "$HOME/.rd/bin" "$HOME/Library/Application Support/rancher-desktop" || true
          tail -n 100 "$HOME"/Library/Logs/rancher-desktop/*.log || true
          # macOS unified log: Gatekeeper/launch services/crash reports for the app.
          log show --last 20m --predicate 'process == "Rancher Desktop" OR eventMessage CONTAINS "Rancher Desktop"' --style compact 2>/dev/null | tail -n 80 || true
          exit 1
      - name: Verify the docker CLI is Rancher Desktop's
        run: |
          command -v docker | grep -q "/.rd/bin/docker"
          docker context show
          docker version
      - name: Report the engine's image store
        # The containerd image store (io.containerd.snapshotter.v1): a build
        # here paid 585s to export and 880s to unpack, so the image is loaded.
        run: docker info --format 'driver={{.Driver}} status={{json .DriverStatus}}'

      - name: Trim the sandbox image for this VM job
        # Same settings as the builder, for the same hash.
        run: |
          mkdir -p ~/.config/sagent
          printf '%s\n' 'SAGENT_TOOLS="none"' 'SAGENT_RUST_VERSION="none"' \
            'SAGENT_GO_VERSION="none"' 'SAGENT_JAVA_VERSION="none"' > ~/.config/sagent/config
      - uses: actions/download-artifact@v4
        with:
          name: sagent-macos-image
      - name: Load the prebuilt image
        # See test-macos.
        run: |
          brew install zstd
          zstd -dc sagent-macos-image.tar.zst | docker load
          rm sagent-macos-image.tar.zst
          # The daemon keeps unpacking after `load` returns and can leave
          # `docker info` unanswered for a while (#109).
          for _ in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info >/dev/null 2>&1 || { echo "::error::the engine did not answer within 120s of the image load"; exit 1; }
          want=$(SAGENT_SKIP_RELEASE_CHECK=1 SAGENT_ENGINE_TIMEOUT_SECONDS=60 ./sclaude version | sed -n 's/^Image hash: //p')
          if ! docker image inspect "sagent-sandbox:$want" >/dev/null 2>&1; then
            echo "::error::the prebuilt image is not the one this runner computes ($want); loaded: $(docker images sagent-sandbox --format '{{.Tag}}' | tr '\n' ' ')"
            exit 1
          fi
      - name: Run E2E tests
        # Skipped for the reasons given in test-macos; Rancher Desktop shares
        # only $HOME with its VM.
        env:
          SAGENT_TEST_SKIP: "T02 T10 T10b T31 T12b"
          SAGENT_ENGINE_TIMEOUT_SECONDS: "60"
        run: |
          mkdir -p "$HOME/sagent-test"
          SAGENT_TEST_TMPDIR="$HOME/sagent-test" bash test_e2e.sh

  test-devcontainers:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli
      - name: Run devcontainer build tests
        run: bash test_devcontainers.sh
      # UID 1000 with a nested daemon: the setup that exposed #56 and #57.
      - name: Run E2E suite inside the dev container (UID 1000, Docker-in-Docker)
        # `devcontainer exec` starts from the container's own environment.
        run: |
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . \
            --remote-env SAGENT_APT_MIRROR="$SAGENT_APT_MIRROR" \
            --remote-env TEST_TIMEOUT_SECONDS="$TEST_TIMEOUT_SECONDS" \
            bash test_e2e.sh
