name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same PR or branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Restrict permissions to minimum needed
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title is conventional
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits: <type>[optional scope]: <description>"
            echo "  Got: $PR_TITLE"
            echo "  Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi

  # Lint via pre-commit so CI enforces exactly the hook set contributors run
  # locally (shellcheck, actionlint, zsh/bash syntax, forbidden-trigger ban).
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install lint dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run pre-commit hooks
        run: pipx run pre-commit run --all-files --show-diff-on-failure

  lint-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pre-commit
        run: brew install pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  test-linux:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run E2E tests
        run: bash test_e2e.sh

  test-linux-podman:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Run E2E tests against podman
        run: SAGENT_CONTAINER_ENGINE=podman bash test_e2e.sh

  # Real docker CLI talking to a podman server through the docker-compat
  # socket — the flavor combo where builds must use the classic builder
  # endpoint (DOCKER_BUILDKIT=0) instead of buildx.
  test-linux-docker-cli-podman:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman and expose its docker-compat socket
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          podman system service --time=0 "unix:///tmp/podman-compat.sock" &
          for _ in $(seq 1 20); do
            [ -S /tmp/podman-compat.sock ] && break
            sleep 0.5
          done
          echo "DOCKER_HOST=unix:///tmp/podman-compat.sock" >> "$GITHUB_ENV"
      - name: Verify flavor detection
        run: docker version | grep -qi podman
      - name: Run E2E tests (docker CLI on podman server)
        run: SAGENT_CONTAINER_ENGINE=docker bash test_e2e.sh

  # A `docker` command that is actually podman (the podman-docker shim
  # arrangement), exercised via a podman symlink named docker on PATH.
  test-linux-podman-shim:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman and front it as the docker command
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          mkdir -p "$HOME/shimbin"
          ln -s "$(command -v podman)" "$HOME/shimbin/docker"
          echo "$HOME/shimbin" >> "$GITHUB_PATH"
      - name: Run E2E tests (podman as the docker command)
        run: SAGENT_CONTAINER_ENGINE=docker bash test_e2e.sh

  test-macos:
    # Real macOS host with a Linux VM behind the engine — the Docker Desktop /
    # podman machine topology (docker CLI on the host, dockerd in a VM). Runs
    # on the Intel runner: Apple Silicon runners have no nested virtualization,
    # so the VM cannot start there. T27 inside adds the third nesting level
    # (mac host -> VM -> sandbox container -> nested podman container).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Install docker CLI, buildx, and colima
        run: |
          brew install docker docker-buildx colima
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix)/opt/docker-buildx/bin/docker-buildx" ~/.docker/cli-plugins/docker-buildx
      - name: Start colima VM
        # vz (Virtualization.framework) instead of the default qemu — markedly
        # faster on the Intel runners.
        run: colima start --vm-type vz --cpu 4 --memory 10 --disk 30
      - name: Wait for the VM's docker daemon
        # colima start can return while (or without) dockerd becoming
        # reachable; assert readiness with a clear error instead of failing
        # later with a generic "no engine responding".
        run: |
          for _ in $(seq 1 24); do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "colima reports started but docker is not reachable" >&2
          colima status
          exit 1
      - name: Prime the image build cache
        # The cold build takes 10-20+ minutes depending on the runner instance
        # and would trip the per-test timeout inside the suite; built here, T02
        # revalidates the build path from cache in seconds.
        run: SAGENT_SKIP_RELEASE_CHECK=1 ./sclaude --build
      - name: Run E2E tests
        # This job's unique coverage is the mac-host/VM topology; T10's update
        # logic and T31's CA-bundle build are engine-independent and covered by
        # every Linux job, and each costs a full image build (30+ minutes for
        # T10's no-cache rebuild on this runner). The cold T02 build needs
        # more than the default 600s per-test budget.
        env:
          TEST_TIMEOUT_SECONDS: "1200"
          SAGENT_TEST_SKIP: "T10 T31"
        run: bash test_e2e.sh

  # Rancher Desktop with its dockerd (moby) engine on a macOS host: the
  # docker CLI from ~/.rd/bin talking to dockerd in Rancher Desktop's Lima VM.
  # This is the setup behind #68 and the README's Rancher Desktop notes.
  # Rancher Desktop is driven headlessly with rdctl; it shares only $HOME with
  # the VM, so the suite's bind-mounted fixtures live under the home directory
  # and T12b (a /tmp workspace) is skipped along with the two full-build tests.
  test-macos-rancher:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      RDCTL: /Applications/Rancher Desktop.app/Contents/Resources/resources/darwin/bin/rdctl
    steps:
      - uses: actions/checkout@v5
      - name: Install Rancher Desktop
        run: brew install --cask rancher
      - name: Start Rancher Desktop (dockerd engine, no Kubernetes, in the background)
        run: |
          "$RDCTL" start \
            --application.start-in-background \
            --application.admin-access=false \
            --application.updater.enabled=false \
            --application.path-management-strategy=manual \
            --container-engine.name=moby \
            --kubernetes.enabled=false \
            --virtual-machine.type=vz \
            --virtual-machine.memory-in-gb=10 \
            --virtual-machine.number-cpus=4 \
            --no-modal-dialogs
          echo "$HOME/.rd/bin" >> "$GITHUB_PATH"
      - name: Wait for Rancher Desktop's docker daemon
        run: |
          for _ in $(seq 1 90); do
            if [ -x "$HOME/.rd/bin/docker" ] && "$HOME/.rd/bin/docker" info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "Rancher Desktop did not become ready" >&2
          "$RDCTL" list-settings || true
          ls -la "$HOME/.rd/bin" || true
          tail -n 100 "$HOME"/Library/Logs/rancher-desktop/*.log || true
          exit 1
      - name: Verify the docker CLI is Rancher Desktop's
        run: |
          command -v docker | grep -q "/.rd/bin/docker"
          docker context show
          docker version
      - name: Prime the image build cache
        run: SAGENT_SKIP_RELEASE_CHECK=1 ./sclaude --build
      - name: Run E2E tests
        env:
          TEST_TIMEOUT_SECONDS: "1200"
          SAGENT_TEST_SKIP: "T10 T31 T12b"
        run: |
          mkdir -p "$HOME/sagent-test"
          SAGENT_TEST_TMPDIR="$HOME/sagent-test" bash test_e2e.sh

  test-devcontainers:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli
      - name: Run devcontainer build tests
        run: bash test_devcontainers.sh
      # The dev container runs as UID-1000 vscode with a nested Docker daemon —
      # the configuration that exposed bugs #56 (ubuntu-user sudoers collision)
      # and #57 (SELinux) classes of platform bugs. Run the full suite inside.
      - name: Run E2E suite inside the dev container (UID 1000, Docker-in-Docker)
        run: |
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . bash test_e2e.sh
