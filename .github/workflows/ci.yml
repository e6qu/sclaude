name: CI

on:
  pull_request:
  push:
    branches: [main]

# No CI on the release PR. It is opened by github-actions[bot], and GitHub
# holds workflow runs on bot-authored PRs for manual approval, so no job
# ever starts and the check ends red for good. Releasing itself is
# untouched: the Release Please workflow runs on push to main, and merging
# that PR still cuts the release, uploads the wrappers and publishes the
# images. The commit is tested on main right after the merge, and the
# release workflow re-verifies the published wrappers.

# Cancel superseded runs for a pull request, but never on main: two merges
# landing together used to cancel main's suite, and nothing gates releasing
# on CI, so a release could be cut from a commit whose tests never finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Restrict permissions to minimum needed
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # These runners are Azure VMs sitting beside Canonical's Azure mirror.
  # From the default archive a single package index has taken ten minutes
  # here and timed out a job; from this one it arrives in seconds. Only the
  # Linux jobs use it (x86_64: an arm64 build would need the ports mirror),
  # and the macOS jobs keep Ubuntu's default.
  SAGENT_APT_MIRROR: http://azure.archive.ubuntu.com/ubuntu/
  # A cold T02 build fetches an Ubuntu base, five toolchains and the cloud
  # tooling; that does not fit the harness's default 600s per test. The
  # macOS jobs already ran at this budget for the same reason.
  TEST_TIMEOUT_SECONDS: "1200"

jobs:
  # A run whose every job is filtered out has nothing to conclude from, and
  # GitHub calls that a failure ("This run likely failed because of a
  # workflow file issue"), which left a permanent red X on every release PR.
  # This job never filters itself out, so the run concludes on it, and it
  # says why the others did not run.
  what-ran:
    runs-on: ubuntu-latest
    steps:
      - name: Say which jobs this run has and why
        # A branch name is whatever its author typed, so it reaches the shell
        # as data in the environment, never spliced into the script.
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$HEAD_REF" = 'release-please--branches--main' ]; then
            echo "Release PR: the test jobs are skipped on purpose."
            echo "The commit is tested on main right after the merge, and the"
            echo "release workflow re-verifies the published wrappers."
          else
            echo "Testing $EVENT on $REF_NAME."
          fi

  commit-lint:
    if: github.event_name == 'pull_request' && github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title is conventional
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits: <type>[optional scope]: <description>"
            echo "  Got: $PR_TITLE"
            echo "  Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi

  # Lint via pre-commit so CI enforces exactly the hook set contributors run
  # locally (shellcheck, actionlint, zsh/bash syntax, forbidden-trigger ban).
  lint:
    if: github.event_name == 'pull_request' && github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install lint dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run pre-commit hooks
        run: pipx run pre-commit run --all-files --show-diff-on-failure

  lint-macos:
    if: github.event_name == 'pull_request' && github.head_ref != 'release-please--branches--main'
    runs-on: macos-latest
    env:
      # Not an Azure runner: Ubuntu's own archive is the right default here.
      SAGENT_APT_MIRROR: ""
    steps:
      - uses: actions/checkout@v5
      - name: Install pre-commit
        run: brew install pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  test-linux:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run E2E tests
        run: bash test_e2e.sh

  test-linux-podman:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Run E2E tests against podman
        run: SAGENT_CONTAINER_ENGINE=podman bash test_e2e.sh

  # Real docker CLI talking to a podman server through the docker-compat
  # socket — the flavor combo where builds must use the classic builder
  # endpoint (DOCKER_BUILDKIT=0) instead of buildx. The socket is rootful
  # (the podman-docker server arrangement): on a rootless socket the docker
  # CLI cannot request podman's keep-id mapping and the wrapper refuses (#75,
  # covered by T34 with a stub).
  test-linux-docker-cli-podman:
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman and expose its docker-compat socket
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          sudo podman system service --time=0 "unix:///tmp/podman-compat.sock" &
          for _ in $(seq 1 20); do
            [ -S /tmp/podman-compat.sock ] && break
            sleep 0.5
          done
          sudo chmod 666 /tmp/podman-compat.sock
          echo "DOCKER_HOST=unix:///tmp/podman-compat.sock" >> "$GITHUB_ENV"
      - name: Verify flavor detection (podman server, rootful)
        run: |
          docker version | grep -qi podman
          docker info --format '{{join .SecurityOptions ","}}' | grep -qv rootless
      - name: Run E2E tests (docker CLI on podman server)
        run: SAGENT_CONTAINER_ENGINE=docker bash test_e2e.sh

  # A `docker` command that is actually podman (the podman-docker shim
  # arrangement), exercised via a podman symlink named docker on PATH.
  test-linux-podman-shim:
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman and front it as the docker command
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          mkdir -p "$HOME/shimbin"
          ln -s "$(command -v podman)" "$HOME/shimbin/docker"
          echo "$HOME/shimbin" >> "$GITHUB_PATH"
      - name: Run E2E tests (podman as the docker command)
        run: SAGENT_CONTAINER_ENGINE=docker bash test_e2e.sh

  test-macos:
    # Real macOS host with a Linux VM behind the engine — the Docker Desktop /
    # podman machine topology (docker CLI on the host, dockerd in a VM). Runs
    # on the Intel runner: Apple Silicon runners have no nested virtualization,
    # so the VM cannot start there. T27 inside adds the third nesting level
    # (mac host -> VM -> sandbox container -> nested podman container).
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    runs-on: macos-15-intel
    env:
      # Not an Azure runner: Ubuntu's own archive is the right default here.
      SAGENT_APT_MIRROR: ""
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Install docker CLI, buildx, and colima
        run: |
          brew install docker docker-buildx colima
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix)/opt/docker-buildx/bin/docker-buildx" ~/.docker/cli-plugins/docker-buildx
      - name: Start colima VM
        # vz (Virtualization.framework) instead of the default qemu — markedly
        # faster on the Intel runners.
        run: colima start --vm-type vz --cpu 4 --memory 10 --disk 30
      - name: Wait for the VM's docker daemon
        # colima start can return while (or without) dockerd becoming
        # reachable; assert readiness with a clear error instead of failing
        # later with a generic "no engine responding".
        run: |
          for _ in $(seq 1 24); do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "colima reports started but docker is not reachable" >&2
          colima status
          exit 1
      - name: Trim the sandbox image for this VM job
        # This job's coverage is the mac-host/VM topology, not image content:
        # every Linux job builds the full image. The toolchains left out here
        # are the bulk of the bytes, and on a VM-backed engine the image size
        # drives the build twice over (download, then export and unpack).
        # Written to the config file, not the environment, so tests that set
        # their own SAGENT_CONFIG_FILE or environment (T32, T35, T38) still
        # see the defaults they expect.
        run: |
          mkdir -p ~/.config/sagent
          printf '%s\n' 'SAGENT_TOOLS="none"' 'SAGENT_RUST_VERSION="none"' \
            'SAGENT_GO_VERSION="none"' 'SAGENT_JAVA_VERSION="none"' > ~/.config/sagent/config
      - name: Prime the image build cache
        # The cold build takes 10-20+ minutes depending on the runner instance
        # and would trip the per-test timeout inside the suite; built here, T02
        # revalidates the build path from cache in seconds.
        run: SAGENT_SKIP_RELEASE_CHECK=1 ./sclaude --build
      - name: Run E2E tests
        # This job's unique coverage is the mac-host/VM topology; T10's update
        # logic and T31's CA-bundle build are engine-independent and covered by
        # every Linux job, and each costs a full image build (30+ minutes for
        # T10's no-cache rebuild on this runner). The cold T02 build needs
        # more than the default 600s per-test budget. colima shares only $HOME
        # and /tmp/colima with its VM, so bind-mounted fixtures live under the
        # home directory and T12b (a /tmp workspace) is skipped.
        env:
          TEST_TIMEOUT_SECONDS: "1200"
          # T02 is the build the "Prime the image build cache" step above
          # already ran; repeating it costs another full image export and
          # unpack on these VM engines for no extra coverage.
          SAGENT_TEST_SKIP: "T02 T10 T10b T31 T12b"
          # The engine probe (docker info) can stall for more than the 10s
          # default while the Lima VM is under build/test load; one such stall
          # failed T04 with "engine not responding" on an otherwise green run.
          SAGENT_ENGINE_TIMEOUT_SECONDS: "60"
        run: |
          mkdir -p "$HOME/sagent-test"
          SAGENT_TEST_TMPDIR="$HOME/sagent-test" bash test_e2e.sh

  # Rancher Desktop with its dockerd (moby) engine on a macOS host: the
  # docker CLI from ~/.rd/bin talking to dockerd in Rancher Desktop's Lima VM.
  # This is the setup behind #68 and the README's Rancher Desktop notes.
  # Rancher Desktop is driven headlessly with rdctl; it shares only $HOME with
  # the VM, so the suite's bind-mounted fixtures live under the home directory
  # and T12b (a /tmp workspace) is skipped along with the two full-build tests.
  test-macos-rancher:
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      # Not an Azure runner: Ubuntu's own archive is the right default here.
      SAGENT_APT_MIRROR: ""
      RDCTL: /Applications/Rancher Desktop.app/Contents/Resources/resources/darwin/bin/rdctl
    steps:
      - uses: actions/checkout@v5
      - name: Install Rancher Desktop
        # Strip the quarantine attribute Homebrew puts on casks: a quarantined
        # GUI app launched via `open` blocks on a Gatekeeper prompt nobody can
        # click on a runner (the app process existed but never wrote settings
        # or logs). Homebrew no longer accepts --no-quarantine.
        run: |
          brew install --cask rancher
          xattr -l "/Applications/Rancher Desktop.app" || true
          xattr -dr com.apple.quarantine "/Applications/Rancher Desktop.app" || true
          xattr -l "/Applications/Rancher Desktop.app" || true
      - name: Start Rancher Desktop (dockerd engine, no Kubernetes, in the background)
        run: |
          "$RDCTL" start \
            --application.start-in-background \
            --application.admin-access=false \
            --application.updater.enabled=false \
            --application.path-management-strategy=manual \
            --container-engine.name=moby \
            --kubernetes.enabled=false \
            --virtual-machine.type=vz \
            --virtual-machine.memory-in-gb=10 \
            --virtual-machine.number-cpus=4 \
            --no-modal-dialogs
          echo "$HOME/.rd/bin" >> "$GITHUB_PATH"
      - name: Wait for Rancher Desktop's docker daemon
        # The VZ guest occasionally boots without network on a runner host (its
        # SSH address stays unreachable while the VM reports "running"); a
        # second start on the same runner has recovered from that. One
        # restart, bounded, then the diagnostics below.
        run: |
          wait_ready() {
            for _ in $(seq 1 "$1"); do
              if [ -x "$HOME/.rd/bin/docker" ] && "$HOME/.rd/bin/docker" info >/dev/null 2>&1; then
                return 0
              fi
              sleep 10
            done
            return 1
          }
          if wait_ready 42; then exit 0; fi
          echo "Rancher Desktop not ready after 7 minutes; restarting it once" >&2
          "$RDCTL" shutdown || true
          sleep 15
          "$RDCTL" start \
            --application.start-in-background \
            --application.admin-access=false \
            --application.updater.enabled=false \
            --application.path-management-strategy=manual \
            --container-engine.name=moby \
            --kubernetes.enabled=false \
            --virtual-machine.type=vz \
            --virtual-machine.memory-in-gb=10 \
            --virtual-machine.number-cpus=4 \
            --no-modal-dialogs
          if wait_ready 60; then exit 0; fi
          echo "Rancher Desktop did not become ready" >&2
          pgrep -fl "Rancher Desktop" || echo "no Rancher Desktop process"
          "$RDCTL" list-settings || true
          ls -la "$HOME/.rd/bin" "$HOME/Library/Application Support/rancher-desktop" || true
          tail -n 100 "$HOME"/Library/Logs/rancher-desktop/*.log || true
          # macOS unified log: Gatekeeper/launch services/crash reports for the app.
          log show --last 20m --predicate 'process == "Rancher Desktop" OR eventMessage CONTAINS "Rancher Desktop"' --style compact 2>/dev/null | tail -n 80 || true
          exit 1
      - name: Verify the docker CLI is Rancher Desktop's
        run: |
          command -v docker | grep -q "/.rd/bin/docker"
          docker context show
          docker version
      - name: Trim the sandbox image for this VM job
        # This job's coverage is the mac-host/VM topology, not image content:
        # every Linux job builds the full image. The toolchains left out here
        # are the bulk of the bytes, and on a VM-backed engine the image size
        # drives the build twice over (download, then export and unpack).
        # Written to the config file, not the environment, so tests that set
        # their own SAGENT_CONFIG_FILE or environment (T32, T35, T38) still
        # see the defaults they expect.
        run: |
          mkdir -p ~/.config/sagent
          printf '%s\n' 'SAGENT_TOOLS="none"' 'SAGENT_RUST_VERSION="none"' \
            'SAGENT_GO_VERSION="none"' 'SAGENT_JAVA_VERSION="none"' > ~/.config/sagent/config
      - name: Prime the image build cache
        run: SAGENT_SKIP_RELEASE_CHECK=1 ./sclaude --build
      - name: Run E2E tests
        env:
          TEST_TIMEOUT_SECONDS: "1200"
          # T02 is the build the "Prime the image build cache" step above
          # already ran; repeating it costs another full image export and
          # unpack on these VM engines for no extra coverage.
          SAGENT_TEST_SKIP: "T02 T10 T10b T31 T12b"
          SAGENT_ENGINE_TIMEOUT_SECONDS: "60"
        run: |
          mkdir -p "$HOME/sagent-test"
          SAGENT_TEST_TMPDIR="$HOME/sagent-test" bash test_e2e.sh

  test-devcontainers:
    # Trusted contexts only: push to main, or PRs from same repo (not forks).
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli
      - name: Run devcontainer build tests
        run: bash test_devcontainers.sh
      # The dev container runs as UID-1000 vscode with a nested Docker daemon —
      # the configuration that exposed bugs #56 (ubuntu-user sudoers collision)
      # and #57 (SELinux) classes of platform bugs. Run the full suite inside.
      - name: Run E2E suite inside the dev container (UID 1000, Docker-in-Docker)
        run: |
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . bash test_e2e.sh
