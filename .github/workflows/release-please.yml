name: Release Please

on:
  push:
    branches:
      - main
  # Finish a release whose publishing stopped part way (#81).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to finish publishing (for example v2.15.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  # Relabelling the release PR goes through the issues API; without this the
  # action blames the release endpoint instead.
  issues: write

# Serialize runs: two quick merges to main must not race each other's
# release PR updates or asset uploads.
concurrency:
  group: release-please

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Creates the release (a draft, #100) from a merged release PR. It does not
  # build the next release PR: a draft has no tag, and building the PR in the
  # same run found "no latest release", took every commit since the first
  # one and opened a 3.0.0 (#106). The `release-pr` job at the end does that
  # once the release is published.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # The tag the jobs below publish, and the ref to build it from: the release
  # is a draft until its wrappers are attached (#100), and a draft has no git
  # tag yet, so on a push that is the release commit; by hand it is the tag.
  tag:
    needs: release-please
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created)
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            name="$DISPATCH_TAG"; ref="$DISPATCH_TAG"
          else
            name="$RELEASE_TAG"; ref="$RELEASE_SHA"
          fi
          if [ -z "$name" ] || [ -z "$ref" ]; then
            echo "::error::no tag to publish"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  upload-assets:
    needs: tag
    # always(): a skipped release-please would otherwise skip everything below.
    if: always() && needs.tag.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # The release commit, not github.sha: back-to-back merges shipped
      # mis-stamped wrappers once (#67).
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.ref }}
      - name: Upload scripts and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.name }}
        run: |
          # --clobber keeps a re-run of a partially failed workflow idempotent.
          gh release upload "$TAG" sclaude scodex --clobber

          EXISTING=$(gh release view "$TAG" --json body --jq .body)
          # A re-run must not append the install instructions a second time.
          case "$EXISTING" in
            *"## Install / Update"*)
              echo "Install instructions already present; skipping body edit."
              exit 0
              ;;
          esac
          INSTALL_INSTRUCTIONS=$(cat <<'EOF'

          ---

          ## Install / Update

          **Fresh install** — no sudo, both wrappers go to `~/.local/bin`:
          ```bash
          curl -fsSL https://github.com/e6qu/sclaude/releases/latest/download/sclaude -o sclaude
          curl -fsSL https://github.com/e6qu/sclaude/releases/latest/download/scodex -o scodex
          chmod +x sclaude scodex
          ./sclaude install
          ```

          **Update an existing install:**
          ```bash
          sclaude update   # both wrappers, then the Claude and Codex CLIs in the image
          ```

          **From source:**
          ```bash
          git pull && sclaude --build
          ```
          EOF
          )

          gh release edit "$TAG" --notes "${EXISTING}${INSTALL_INSTRUCTIONS}"

      # The checks the self-updater applies, so a broken asset is caught here.
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.name }}
        run: |
          expected_version="${TAG#v}"
          tmpdir=$(mktemp -d)
          for asset in sclaude scodex; do
            gh release download "$TAG" --pattern "$asset" --dir "$tmpdir"
            downloaded="$tmpdir/$asset"
            head -1 "$downloaded" | grep -qx '#!/usr/bin/env bash'
            grep -qE "^SCRIPT_NAME=\"$asset\"\$" "$downloaded"
            grep -qE "^WRAPPER_VERSION=\"$expected_version\"( *#.*)?\$" "$downloaded"
            bash -n "$downloaded"
            echo "$asset: shebang, SCRIPT_NAME, WRAPPER_VERSION=$expected_version, syntax OK"
          done
      - name: Publish the release
        # Only now does `latest` point here: a release visible before its
        # wrappers were attached gave `sclaude update` and the dev container
        # example a 404 for as long as this job sat in the queue (#100).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.name }}
        run: gh release edit "$TAG" --draft=false

  # The image, built natively per architecture from the released wrapper's
  # Dockerfile. Tags: <version>-amd64, <version>-arm64, <version>; never latest.
  build-image:
    needs: tag
    if: always() && needs.tag.result == 'success'
    strategy:
      fail-fast: false
      # One push at a time: two at once got "unknown blob" from ghcr (#91).
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.tag.outputs.name }}
      ARCH: ${{ matrix.arch }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/sagent-sandbox
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.ref }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push ${{ matrix.arch }} image
        run: |
          set -euo pipefail
          version="${TAG#v}"
          ctx=$(mktemp -d)
          SAGENT_IMAGE_UID=1000 SAGENT_IMAGE_GID=1000 SAGENT_SKIP_RELEASE_CHECK=1 \
            ./sclaude dockerfile > "$ctx/Dockerfile"
          [ "$(dpkg --print-architecture)" = "$ARCH" ]
          docker build --load \
            --build-arg USER_UID=1000 --build-arg USER_GID=1000 \
            -t "$IMAGE:$version-$ARCH" -f "$ctx/Dockerfile" "$ctx"
          docker run --rm "$IMAGE:$version-$ARCH" bash -ec '
            claude --version >/dev/null
            codex --version >/dev/null
            gh --version >/dev/null
            [ "$(id -u):$(id -g)" = 1000:1000 ]
          '
          # Build metadata lives in labels, not a file in the image.
          docker image inspect "$IMAGE:$version-$ARCH" \
            --format '{{index .Config.Labels "sagent.version"}} {{index .Config.Labels "sagent.build_timestamp"}}' \
            | tee /dev/stderr | grep -qE '^[0-9a-f]{8} [0-9]{4}-'
          docker push "$IMAGE:$version-$ARCH"
          # Read it back, so a manifest is never built on a tag nobody can pull.
          docker manifest inspect "$IMAGE:$version-$ARCH" >/dev/null

  publish-manifest:
    needs: [tag, build-image]
    if: always() && needs.tag.result == 'success' && needs.build-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.tag.outputs.name }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/sagent-sandbox
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the multi-arch manifest
        run: |
          set -euo pipefail
          version="${TAG#v}"
          docker buildx imagetools create -t "$IMAGE:$version" \
            "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          docker buildx imagetools inspect "$IMAGE:$version" | tee inspect.txt
          grep -q 'linux/amd64' inspect.txt
          grep -q 'linux/arm64' inspect.txt

  # The next release PR, built only once any release this push made is
  # published, so its base is a tag that exists (#106). A publish that
  # failed leaves the PR alone: the draft is finished by hand first.
  release-pr:
    needs: [release-please, upload-assets]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.release-please.result == 'success' &&
      (needs.upload-assets.result == 'success' || needs.upload-assets.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
