name: Release Please

on:
  push:
    branches:
      - main
  # Finish a release whose publishing did not complete. release-please can
  # create the release and then fail on a transient GitHub API error, which
  # skips every job below it and leaves a release with no wrappers and no
  # images. Run this with that tag to publish what is missing.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to finish publishing (for example v2.15.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# Serialize runs: two quick merges to main must not race each other's
# release PR updates or asset uploads.
concurrency:
  group: release-please

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The tag the jobs below publish: the one release-please just created, or
  # the one asked for by hand.
  tag:
    needs: release-please
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created)
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
    steps:
      - id: pick
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            name="$DISPATCH_TAG"
          else
            name="$RELEASE_TAG"
          fi
          if [ -z "$name" ]; then
            echo "::error::no tag to publish"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

  upload-assets:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      # Check out the TAG, not github.sha: when merges land back-to-back, the
      # run that creates the release can be the one triggered by an earlier
      # commit, and assets built from that checkout predate the version-bump
      # commit (shipped mis-stamped wrappers on v2.6.3).
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.name }}
      - name: Upload scripts and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.name }}
        run: |
          # --clobber keeps a re-run of a partially failed workflow idempotent.
          gh release upload "$TAG" sclaude scodex --clobber

          EXISTING=$(gh release view "$TAG" --json body --jq .body)
          # A re-run must not append the install instructions a second time.
          case "$EXISTING" in
            *"## Install / Update"*)
              echo "Install instructions already present; skipping body edit."
              exit 0
              ;;
          esac
          INSTALL_INSTRUCTIONS=$(cat <<'EOF'

          ---

          ## Install / Update

          **Fresh install:**
          ```bash
          curl -fsSL https://github.com/e6qu/sclaude/releases/latest/download/sclaude -o sclaude
          chmod +x sclaude
          sudo mv sclaude /usr/local/bin/sclaude
          curl -fsSL https://github.com/e6qu/sclaude/releases/latest/download/scodex -o scodex
          chmod +x scodex
          sudo mv scodex /usr/local/bin/scodex
          ```

          **Update existing install:**
          ```bash
          sudo curl -fsSL https://github.com/e6qu/sclaude/releases/latest/download/sclaude -o /usr/local/bin/sclaude
          sudo chmod +x /usr/local/bin/sclaude
          sudo curl -fsSL https://github.com/e6qu/sclaude/releases/latest/download/scodex -o /usr/local/bin/scodex
          sudo chmod +x /usr/local/bin/scodex
          sclaude update   # updates Claude and Codex CLIs inside the shared container
          ```

          **From source:**
          ```bash
          git pull
          sclaude --build
          sudo install -m 0755 sclaude /usr/local/bin/sclaude
          sudo install -m 0755 scodex /usr/local/bin/scodex
          ```
          EOF
          )

          gh release edit "$TAG" --notes "${EXISTING}${INSTALL_INSTRUCTIONS}"

      # Verify the published assets pass the exact checks the wrapper
      # self-updater applies (plus a bash syntax check), so a broken release —
      # e.g. release-please failing to stamp WRAPPER_VERSION — is caught here
      # instead of on users' machines.
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.name }}
        run: |
          expected_version="${TAG#v}"
          tmpdir=$(mktemp -d)
          for asset in sclaude scodex; do
            gh release download "$TAG" --pattern "$asset" --dir "$tmpdir"
            downloaded="$tmpdir/$asset"
            head -1 "$downloaded" | grep -qx '#!/usr/bin/env bash'
            grep -qE "^SCRIPT_NAME=\"$asset\"\$" "$downloaded"
            grep -qE "^WRAPPER_VERSION=\"$expected_version\"( *#.*)?\$" "$downloaded"
            bash -n "$downloaded"
            echo "$asset: shebang, SCRIPT_NAME, WRAPPER_VERSION=$expected_version, syntax OK"
          done

  # The shared sandbox image, built natively per architecture from the
  # released wrapper's own Dockerfile (so it is byte-for-byte what a wrapper
  # run by uid/gid 1000 builds), then joined under one tag as a multi-arch
  # manifest. Tags: <version>-amd64, <version>-arm64, <version>; never
  # latest, so nothing moves under a user.
  build-image:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.tag.outputs.name }}
      ARCH: ${{ matrix.arch }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/sagent-sandbox
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.name }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push ${{ matrix.arch }} image
        run: |
          set -euo pipefail
          version="${TAG#v}"
          ctx=$(mktemp -d)
          SAGENT_IMAGE_UID=1000 SAGENT_IMAGE_GID=1000 SAGENT_SKIP_RELEASE_CHECK=1 \
            ./sclaude dockerfile > "$ctx/Dockerfile"
          [ "$(dpkg --print-architecture)" = "$ARCH" ]
          docker build --load \
            --build-arg USER_UID=1000 --build-arg USER_GID=1000 \
            -t "$IMAGE:$version-$ARCH" -f "$ctx/Dockerfile" "$ctx"
          docker run --rm "$IMAGE:$version-$ARCH" bash -ec '
            claude --version >/dev/null
            codex --version >/dev/null
            gh --version >/dev/null
            [ "$(id -u):$(id -g)" = 1000:1000 ]
          '
          # Build metadata lives in labels, not a file in the image.
          docker image inspect "$IMAGE:$version-$ARCH" \
            --format '{{index .Config.Labels "sagent.version"}} {{index .Config.Labels "sagent.build_timestamp"}}' \
            | tee /dev/stderr | grep -qE '^[0-9a-f]{8} [0-9]{4}-'
          docker push "$IMAGE:$version-$ARCH"

  publish-manifest:
    needs: [tag, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.tag.outputs.name }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/sagent-sandbox
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the multi-arch manifest
        run: |
          set -euo pipefail
          version="${TAG#v}"
          docker buildx imagetools create -t "$IMAGE:$version" \
            "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          docker buildx imagetools inspect "$IMAGE:$version" | tee inspect.txt
          grep -q 'linux/amd64' inspect.txt
          grep -q 'linux/arm64' inspect.txt
